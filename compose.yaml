services:
  mcp:
    container_name: mcp-server
    build: ./mcp-server
    expose: ['3001']
    ports: ['127.0.0.1:8001:3001']
    networks: [lab]
  nginx:
    container_name: nginx
    image: nginx:1.31.6-alpine-otel@sha256:f237a3efb7233a400a89c2bbb16c68dc4036de731c143a2a87160b3c9238f0b3
    ports: ['0.0.0.0:8080:8080']
    tmpfs:
      - /tmp/nginx:mode=1777
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:rw
      - ./nginx/snippets:/etc/nginx/mcp:ro
      - ./nginx/conf.d:/etc/nginx/demo-conf:ro
      - ./njs:/etc/nginx/njs:ro
      - ./nginx/control:/demo-control
      - ./nginx/editor-supervisor.sh:/demo-editor-supervisor.sh:ro
    command: ["/bin/sh", "/demo-editor-supervisor.sh"]
    depends_on: [mcp]
    networks: [lab]
  ui:
    container_name: mission-control
    build: ./ui
    ports: ['0.0.0.0:3000:3000']
    environment:
      DIRECT_MCP_URL: http://mcp:3001/mcp
      MCP_URL: http://nginx:8080/mcp
      GATEWAY_HEALTH_URL: http://nginx:8080/health
      NGINX_EDITOR_TOKEN: ${NGINX_EDITOR_TOKEN:-}
    volumes:
      - ./nginx/nginx.conf:/demo/nginx.conf:ro
      - ./nginx/control:/demo-control
    depends_on: [mcp, nginx]
    networks: [lab]
  otel-collector:
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:0.146.1
    command: ['--config=/etc/otel/config.yaml', '--config=/etc/otel/edge.yaml']
    volumes: ['./otel/collector.yaml:/etc/otel/config.yaml:ro', './otel/edge.yaml:/etc/otel/edge.yaml:ro']
    ports: ['0.0.0.0:4317:4317']
    networks: [lab]
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.9.1
    command: ['--config.file=/etc/prometheus/prometheus.yml']
    volumes: ['./otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro']
    ports: ['0.0.0.0:9090:9090']
    networks: [lab]
  grafana:
    container_name: grafana
    image: grafana/grafana-oss:12.3.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/http:ro
    ports: ['0.0.0.0:3002:3000']
    depends_on: [prometheus]
    networks: [lab]
networks:
  lab: {}
