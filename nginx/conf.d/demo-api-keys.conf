# FAKE API KEYS — FOR DEMONSTRATION PURPOSES ONLY.
# These public, intentionally weak credentials are not secrets.
# Production: HTTPS + OAuth/OIDC, JWT validation or auth_request with an IdP.
# NGINX map must be loaded in the http context.
map $http_x_api_key $agent_role {
    default "anonymous";
    "viewer-demo" "viewer";
    "operator-demo" "operator";
    "admin-demo" "admin";
}
